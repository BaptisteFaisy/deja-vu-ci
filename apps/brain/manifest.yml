# Déjà-vu CI — Cerveau (Brain): the Jira Forge app.
#
# The Brain receives signed failure payloads from the Sensor (Bitbucket)
# and from the universal entry (any CI), computes signatures, stores the
# memory in Forge SQL, diagnoses failures, keeps one Jira ticket per
# failure family, and exposes the six actions to Rovo and MCP.
#
# Module keys and scopes follow the Forge manifest schema for Jira apps.
# `app.id` is a placeholder: `forge create` / `forge install` replaces it
# with the ari of the real app. Never commit a real app id with a secret.

modules:
  webtrigger:
    # The function keys below ARE the URL routes: the Sensor posts to
    # `<base-url>/ingest` and `<base-url>/query` (apps/sensor/src/send.ts),
    # any other CI posts to `<base-url>/universal`.
    - key: deja-vu-ingest
      function: ingest
    - key: deja-vu-query
      function: query
    - key: deja-vu-universal
      function: universal

  consumer:
    - key: deja-vu-consumer
      queue: deja-vu-ingest-queue
      function: consumerHandler
      # Schema: the consumer variant {key, queue, function} accepts no other
      # property (`additionalProperties: false`) — the former `retry` block is
      # rejected. The consumer is idempotent: replaying a message changes
      # nothing, so the platform's own delivery retries are safe.

  scheduledTrigger:
    - key: deja-vu-daily
      function: scheduledHandler
      interval: day

  sql:
    # Schema: `engine` is required and its only allowed value is `mysql`.
    - key: deja-vu-sql
      engine: mysql

  llm:
    # Schema: `model` is required — an array whose only allowed value is
    # `claude` (model families the app may call through `@forge/llm`).
    - key: deja-vu-llm
      model:
        - claude

  jira:projectPage:
    # UI Kit 2: the page is rendered by the shared resource `main`
    # (src/frontend.tsx), which routes on the module key. `render: native`
    # is what UI Kit 2 asks for; `resolver.function` receives every
    # `invoke()` of the screen (`memory-page`).
    - key: deja-vu-project-page
      title: Déjà-vu CI
      resource: main
      resolver:
        function: projectPageResolver
      render: native
      icon: resource:icon;icon.svg

  jira:issuePanel:
    # The panel on the ticket (CI-08: "show the diagnostic on the ticket"):
    # the diagnosis of the latest build of the branch, or the occurrences of
    # the problem when this ticket is the problem ticket. `icon` is required
    # by the schema on this module.
    - key: deja-vu-issue-panel
      title: Déjà-vu CI
      resource: main
      resolver:
        function: issuePanelResolver
      render: native
      icon: resource:icon;icon.svg
      viewportSize: medium

  jira:issueContext:
    # Schema: the function variant of the issue context requires `label`
    # (short title of the panel) next to `key`, `title` and `function`.
    # Kept as **text**: it is what a Rovo agent reads about the ticket —
    # the current diagnostic, its ticket and what the failure already cost
    # (`src/pure/issueContextText.ts`). The panel above is the human view.
    - key: deja-vu-issue-context
      title: Déjà-vu CI
      label: Déjà-vu CI
      function: issueContextText

  jira:projectSettingsPage:
    - key: deja-vu-project-settings
      title: Déjà-vu CI
      resource: main
      resolver:
        function: settingsPageResolver
      render: native
      icon: resource:icon;icon.svg

  rovo:agent:
    - key: deja-vu-rovo-agent
      name: Déjà-vu CI
      description: >-
        CI memory: explains red builds, finds flaky tests, tracks fixes.
      prompt: >-
        You are Déjà-vu CI, the CI memory of this Jira project. Answer with
        a diagnosis and one action (retry, rebase, fix, wait, none). Cite
        the Jira ticket of the problem when there is one, and the fix
        (commit and author) when the failure was already fixed. Never
        invent a commit, an author or a ticket: if the memory does not
        know, say so.
      conversationStarters:
        - Why is the build of PAY-123 red?
        - Have we already seen this error?
        - What are our most flaky tests?
        - Who fixed the database connection error last time?
      actions:
        - explain-build-failure
        - search-failures
        - get-signature
        - list-flaky-tests
        - report-resolution
        - confirm-resolution

  action:
    # Schema: every action requires `key`, `function`, `description` (1–255
    # characters — the text the Rovo agent reads to decide when to invoke the
    # action) and either `actionType` or `actionVerb`. The descriptions below
    # mirror the descriptors of `src/actions/*.ts` (single source of truth).
    - key: explain-build-failure
      function: actionExplainBuildFailure
      actionVerb: GET
      description: >-
        Explain why a CI build failed: returns the diagnostic, its confidence,
        the facts behind it and the action to take.
    - key: search-failures
      function: actionSearchFailures
      actionVerb: GET
      description: >-
        Find the known failure signatures closest to a free-text error excerpt
        (same signature, same family, or close message).
    - key: get-signature
      function: actionGetSignature
      actionVerb: GET
      description: >-
        Get the history of a known failure signature: status, occurrences,
        resolution and Jira ticket.
    - key: list-flaky-tests
      function: actionListFlakyTests
      actionVerb: GET
      description: >-
        List the flaky tests of a repository, ranked by CI cost (minutes lost),
        over a rolling window.
    - key: report-resolution
      function: actionReportResolution
      actionVerb: CREATE
      description: >-
        Record a candidate resolution for a known signature: the commit that
        fixed it, its author and an optional note.
    - key: confirm-resolution
      function: actionConfirmResolution
      actionVerb: UPDATE
      description: >-
        Confirm or reject a candidate resolution for a signature. A confirmed
        resolution is cited to the next developers.

  rovo:mcp:
    # Schema: the MCP server accepts exactly `key`, `name` (1–30 characters)
    # and `tools` — an array of action keys of this manifest (1–50, unique).
    # `description`, `cloud` and `resources` are not allowed properties.
    - key: deja-vu-mcp
      name: Déjà-vu CI MCP
      tools:
        - explain-build-failure
        - search-failures
        - get-signature
        - list-flaky-tests
        - report-resolution
        - confirm-resolution

  function:
    - key: ingest
      handler: index.ingest
    - key: query
      handler: index.query
    - key: universal
      handler: index.universal
    - key: consumerHandler
      handler: index.consumer
    - key: scheduledHandler
      handler: index.scheduled
    # The three UI modules share one resolver handler: `invoke('<name>')` is
    # routed to the resolver of the module, and `src/resolvers.ts` dispatches
    # on the name (`memory-page`, `issue-context`, `settings`, `save-settings`).
    - key: projectPageResolver
      handler: index.uiResolverHandler
    - key: issuePanelResolver
      handler: index.uiResolverHandler
    - key: settingsPageResolver
      handler: index.uiResolverHandler
    # Text context of a ticket, read by Rovo (`jira:issueContext`).
    - key: issueContextText
      handler: index.issueContextText
    - key: actionExplainBuildFailure
      handler: index.explainBuildFailure
    - key: actionSearchFailures
      handler: index.searchFailures
    - key: actionGetSignature
      handler: index.getSignature
    - key: actionListFlakyTests
      handler: index.listFlakyTests
    - key: actionReportResolution
      handler: index.reportResolution
    - key: actionConfirmResolution
      handler: index.confirmResolution

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  external:
    fetch:
      backend: []

# Hosted resources (§ 14): one UI Kit 2 entry point for the three Jira
# modules, and the icon they all display. `path` is relative to the app root,
# and a module refers to an entry with `resource: <key>` — an icon with
# `resource:<key>;<file>`.
resources:
  - key: main
    path: src/frontend.tsx
  - key: icon
    path: static/icon.svg

app:
  id: ari:cloud:ecosystem::app/REPLACE-WITH-THE-REAL-APP-ID
  description: >-
    Recognises a red build, tells in seconds whether it is new, known,
    flaky or an infrastructure failure, and keeps one ticket per problem.
  runtime:
    name: nodejs22.x
  # The Brain is the Jira half of the pair: it creates and comments tickets,
  # so Jira is required (the Sensor, its Bitbucket twin, is a separate app).
  compatibility:
    jira:
      required: true
