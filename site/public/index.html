<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Déjà-vu CI — build failures with memory</title>
    <meta
      name="description"
      content="Déjà-vu CI recognises a red build, tells in seconds whether it is new, known, flaky or infrastructure, and keeps one Jira ticket per problem. Try the real engine in your browser."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      Public site of Déjà-vu CI (GitHub Pages). The skeleton is empty on
      purpose: every visible string lives in `src/lib/i18n.ts` (English and
      French, § 18) and every table is rendered by `src/render/*` from the
      output of the REAL engine (`packages/core`) running in this browser.
      Nothing is fetched: no backend, no analytics, no CDN.
    -->
    <noscript>
      <p class="noscript">
        This demo runs the engine in your browser and needs JavaScript.
        The source is public: https://github.com/BaptisteFaisy/deja-vu-ci
      </p>
    </noscript>

    <header class="topbar" id="topbar"></header>

    <main>
      <section class="hero" id="hero"></section>
      <section class="demo" id="demo"></section>
      <section class="results" id="results" hidden></section>
      <section class="diagnostics" id="diagnostics"></section>
      <section class="how" id="how"></section>
      <section class="honesty" id="honesty"></section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="./bundle.js"></script>
  </body>
</html>
